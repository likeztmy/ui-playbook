<title>Playbook Blind Picks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a sticky bar with the pair and its strip, two equal columns of steps, a sticky bar of choices. */
  :root {
    --bg: oklch(0.985 0.003 250);
    --surface: oklch(1 0 0);
    --fg: oklch(0.24 0.012 250);
    --muted: oklch(0.52 0.012 250);
    --line: oklch(0.9 0.006 250);
    --accent: oklch(0.5 0.13 255);
    --accent-fg: oklch(0.99 0 0);
    --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.18 0.008 250); --surface: oklch(0.22 0.009 250); --fg: oklch(0.93 0.006 250);
      --muted: oklch(0.68 0.01 250); --line: oklch(0.31 0.01 250); --accent: oklch(0.72 0.12 255);
      --accent-fg: oklch(0.18 0.01 250); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(0.18 0.008 250); --surface: oklch(0.22 0.009 250); --fg: oklch(0.93 0.006 250);
    --muted: oklch(0.68 0.01 250); --line: oklch(0.31 0.01 250); --accent: oklch(0.72 0.12 255);
    --accent-fg: oklch(0.18 0.01 250); color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-sans); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
  h1 { flex: 1 1 240px; min-width: 0; margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
  h1 span { font: 500 13px var(--font-mono); color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .strip { display: flex; gap: 4px; flex-wrap: wrap; }
  .strip button { width: 32px; height: 32px; padding: 0; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; position: relative; }
  .strip button[aria-current="true"] { border-color: var(--fg); }
  .strip button[data-picked]::after { content: ""; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  button { font: 500 14px var(--font-sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }

  details { padding-block: 10px; border-bottom: 1px solid var(--line); }
  summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .brief { max-width: 68ch; white-space: pre-wrap; margin: 8px 0 0; }

  .steps { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 16px; padding-block: 12px 24px; }
  .head { font: 500 12px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .step { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); font-weight: 500; }
  .step span { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .shot { display: block; width: 100%; padding: 0; border: 0; background: none; border-radius: 6px; overflow: hidden; outline: 1px solid var(--line); }
  .shot img { display: block; width: 100%; height: auto; }
  .none { aspect-ratio: 16 / 10; max-width: 100%; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); font-size: 13px; }

  footer { position: sticky; bottom: 0; z-index: 5; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .choices { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 10px; }
  .choices button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .choices input { flex: 1 1 200px; min-width: 0; font: 14px var(--font-sans); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  .status { font-size: 13px; color: var(--muted); min-height: 1.5em; flex-basis: 100%; }

  dialog { border: 0; padding: 0; max-width: none; width: 100vw; height: 100vh; max-height: none; background: var(--bg); color: var(--fg); }
  dialog::backdrop { background: var(--bg); }
  .zoom { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .zoom .bar { border-bottom: 1px solid var(--line); }
  .zoom .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding-block: 12px; overflow: auto; align-content: start; }
  .zoom img { width: 100%; height: auto; display: block; border-radius: 6px; outline: 1px solid var(--line); }
  @media (max-width: 700px) {
    .zoom .pair { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header>
  <div class="wrap bar">
    <h1 id="title" tabindex="-1"></h1>
    <nav class="strip" id="strip" aria-label="Pairs"></nav>
    <button type="button" id="prev">Previous</button>
    <button type="button" id="next">Next</button>
  </div>
</header>
<main class="wrap">
  <details id="brief-box"><summary>The brief both builds were given</summary><p class="brief" id="brief"></p></details>
  <div class="steps" id="steps"></div>
</main>
<footer>
  <div class="wrap choices" role="group" aria-label="Which is better?">
    <button type="button" data-pick="left">Left is better</button>
    <button type="button" data-pick="right">Right is better</button>
    <button type="button" data-pick="tie">Tie</button>
    <button type="button" data-pick="both-bad">Both bad</button>
    <input id="note" placeholder="Note (optional)" aria-label="Note" autocomplete="off">
    <div class="status" id="status" role="status"></div>
  </div>
</footer>
<dialog id="zoom" aria-labelledby="zoom-title">
  <div class="zoom">
    <div class="wrap bar"><h1 id="zoom-title"></h1><button type="button" id="zoom-close">Close</button></div>
    <div class="wrap pair" id="zoom-pair"></div>
  </div>
</dialog>

<script>
  const PAIRS = /*DATA*/[];
  const $ = (id) => document.getElementById(id);
  const picks = {};
  let db = null;
  let at = Math.max(0, PAIRS.findIndex((p) => p.id === location.hash.slice(1)));

  function render() {
    const p = PAIRS[at];
    if (!p) { $('title').textContent = 'No pairs yet'; return; }
    $('title').innerHTML = '';
    const n = document.createElement('span');
    n.textContent = `${at + 1} / ${PAIRS.length}`;
    $('title').append(n, p.title);
    document.title = `Pair ${at + 1} · ${p.title}`;
    $('brief').textContent = p.brief;
    $('prev').disabled = at === 0;
    $('next').disabled = at === PAIRS.length - 1;

    $('strip').replaceChildren(...PAIRS.map((q, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = i + 1;
      b.setAttribute('aria-label', `Pair ${i + 1}, ${q.title}${picks[q.id] ? ', picked' : ''}`);
      if (i === at) b.setAttribute('aria-current', 'true');
      if (picks[q.id]) b.dataset.picked = '';
      b.onclick = () => go(i);
      return b;
    }));

    const cells = [head('Left'), head('Right')];
    p.steps.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'step';
      const k = document.createElement('span');
      k.textContent = String(i + 1).padStart(2, '0');
      row.append(k, s.name);
      cells.push(row, shot(s, 'L', i), shot(s, 'R', i));
    });
    $('steps').replaceChildren(...cells);

    const mine = picks[p.id];
    document.querySelectorAll('[data-pick]').forEach((b) => b.setAttribute('aria-pressed', String(mine?.pick === b.dataset.pick)));
    if (document.activeElement !== $('note')) $('note').value = mine?.note ?? '';
  }
  const head = (t) => Object.assign(document.createElement('div'), { className: 'head', textContent: t });
  function shot(s, side, i) {
    if (!s[side]) return Object.assign(document.createElement('div'), { className: 'none', textContent: 'Not reached' });
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'shot';
    b.setAttribute('aria-label', `${side === 'L' ? 'Left' : 'Right'}: ${s.name}, enlarge`);
    const img = Object.assign(document.createElement('img'), { src: s[side], alt: '', loading: i < 2 ? 'eager' : 'lazy', width: 1280, height: 800 });
    b.append(img);
    b.onclick = () => zoom(s, b);
    return b;
  }

  let opener = null;
  function zoom(s, from) {
    opener = from;
    $('zoom-title').textContent = s.name;
    $('zoom-pair').replaceChildren(...['L', 'R'].map((side) => {
      const fig = document.createElement('div');
      fig.append(head(side === 'L' ? 'Left' : 'Right'));
      fig.append(s[side] ? Object.assign(document.createElement('img'), { src: s[side], alt: `${side === 'L' ? 'Left' : 'Right'}: ${s.name}` }) : Object.assign(document.createElement('div'), { className: 'none', textContent: 'Not reached' }));
      return fig;
    }));
    $('zoom').showModal();
    $('zoom-close').focus();
  }
  $('zoom-close').onclick = () => $('zoom').close();
  $('zoom').addEventListener('close', () => opener?.focus());

  function go(i) {
    at = Math.min(Math.max(i, 0), PAIRS.length - 1);
    try { history.replaceState(null, '', '#' + PAIRS[at].id); } catch {}
    $('status').textContent = '';
    render();
    window.scrollTo(0, 0);
    $('title').focus({ preventScroll: true });
  }
  $('prev').onclick = () => go(at - 1);
  $('next').onclick = () => go(at + 1);

  async function save(p, body) {
    if (!db) { $('status').textContent = "Picks can't be saved in this view. Open the page on claude.ai, signed in."; return false; }
    try {
      await db.doc(`picks/${p.id}`).set({ ...body, at: new Date().toISOString() });
      return true;
    } catch (e) {
      $('status').textContent = `Couldn't save: ${e?.message ?? 'try again'}.`;
      return false;
    }
  }
  document.querySelectorAll('[data-pick]').forEach((b) => (b.onclick = async () => {
    const p = PAIRS[at];
    const body = { pick: b.dataset.pick, note: $('note').value.trim() };
    picks[p.id] = body;
    render();
    if (!(await save(p, body))) return;
    // On to the next pair still waiting for a pick, if there is one.
    const next = PAIRS.findIndex((q, i) => i > at && !picks[q.id]);
    if (next >= 0) go(next);
    else $('status').textContent = Object.keys(picks).length === PAIRS.length ? `All ${PAIRS.length} pairs picked.` : 'Saved.';
  }));
  $('note').addEventListener('change', async () => {
    const p = PAIRS[at];
    if (!picks[p.id]) return;
    picks[p.id] = { ...picks[p.id], note: $('note').value.trim() };
    if (await save(p, picks[p.id])) $('status').textContent = 'Note saved.';
  });

  window.addEventListener('hashchange', () => {
    const i = PAIRS.findIndex((p) => p.id === location.hash.slice(1));
    if (i >= 0 && i !== at) go(i);
  });
  render();
  window.claude?.use('db').then((d) => {
    db = d;
    if (!db) return;
    db.collection('picks').onSnapshot((snap) => {
      snap.docs.forEach((d) => { if (d.exists) picks[d.id] = d.data(); });
      render();
    });
  });
</script>
